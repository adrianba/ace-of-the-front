name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Engine tests
        run: node --test tests/engine.test.mjs

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Python and browser tests
        run: uv run pytest --browser-tests

  container:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ace-of-the-front:ci .

      - name: Smoke test image
        run: |
          docker run -d --name game -p 8080:8080 ace-of-the-front:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "Ace of the Front"
          curl -fsI http://127.0.0.1:8080/game.mjs | grep -qi "content-type: text/javascript"
          docker rm -f game

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ace-of-the-front:ci "$IMAGE:latest"
          docker tag ace-of-the-front:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
