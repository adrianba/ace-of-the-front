[project]
name = "ace-of-the-front"
version = "0.1.0"
description = "A browser-based WWI biplane arcade game about facing the aces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ace-of-the-front = "ace_of_the_front:main"

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real Chromium gameplay smoke tests (opt in with --browser-tests)"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
